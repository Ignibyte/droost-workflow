# CI is confirmation here, not authority.
#
# Unlike the droost module — where phpstan and phpunit can only run in the
# pipeline — every gate in this package runs locally from its own vendor/
# (see scripts/lint). CI re-runs the identical script on a clean checkout so
# a green local run cannot be an artefact of one developer's machine.

stages:
  - lint

variables:
  COMPOSER_ALLOW_SUPERUSER: "1"

gate:
  stage: lint
  image: php:8.3-cli
  before_script:
    - apt-get update -yqq && apt-get install -yqq git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --no-progress
  script:
    - ./scripts/lint
  allow_failure: false
