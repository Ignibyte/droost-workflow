# Droost Workflow levers for this repo.
#
# This file is the source of truth for how the workflow runs here. It is a
# file rather than Drupal configuration on purpose: the agent has to be able
# to read it while the site is mid-build or broken, a plain Claude Code or
# Codex user has to get the same answers with no site at all, and loosening a
# gate should show up in review as a diff.
#
# Everything below is written out explicitly. That is deliberate — a file
# that named no preset would resolve to `factory` (strictest), because a repo
# that has said nothing has not opted out of anything. Naming `custom` is how
# you choose the gentler set on purpose.

# automated | pair
#   automated — run plan through complete unattended.
#   pair      — pause at every phase gate and ask before advancing.
mode: automated

# custom | factory | light
#   factory — everything on, strict. The software factory. Full EARS spec.
#   light   — the same phases at lighter weight: a SHORTER spec in the same
#             EARS shape (presented in chat at complete), the mandatory trio
#             with phpstan at level 2, and the rendered check. Light is not
#             a shorter path — nothing skips, and the format never thins.
#   custom  — the values spelled out below.
# (`fast` was renamed `light` in 0.3; the old name is refused with a pointer.)
preset: custom

# hard | soft | off
#   How hard the harness hooks hold the phase discipline WHILE A RUN IS
#   ACTIVE — outside a run the hooks are silent by construction. hard blocks
#   out-of-phase actions; soft warns once per phase; off stands the hooks
#   down and leaves only the gates. Orthogonal to the preset on purpose: you
#   MAY pair factory gates with enforcement off. Not advised — but this file
#   is a reviewable diff, and a visible loosening is the honest way to allow
#   it. (Preset defaults: factory → hard, light → soft.)
enforcement: soft

# DEPRECATED (0.3) and ignored: every run walks plan, code, test, complete
# (0.4 folded document into complete). Tune gate weight per phase instead of
# dropping phases; naming a subset here earns a deprecation notice in every
# lever report.
# phases: [plan, code, test, complete]

# WHETHER an optional gate runs is this file's business; WHEN it runs is the
# engine's phase map — plan runs none, code runs the static pair (then the
# seeker checkpoint), test runs the functional gates, complete captures the
# documentation and re-runs everything enabled, wiki_fresh included. The
# continue command documents the map.
gates:
  # "on" is the only switch a gate has. A threshold does NOT turn one on:
  # setting coverage.min without coverage.on leaves coverage where the preset
  # put it.
  #
  # THE MANDATORY TRIO (0.4): phpcs, phpstan and phpunit cannot be turned
  # off — they are the toolchain Drupal core itself develops with. Their
  # tuning levers below still apply; an `on: false` here is recorded as a
  # deprecation notice and superseded. A site that cannot run one of them
  # yet gets an honest labeled answer, never a silent pass.
  #
  # The static pair also accepts `paths` — comma-separated repo-relative
  # files or directories to analyse. Omitted, each tool discovers the repo's
  # own config (phpcs.xml.dist, phpstan.neon); set it where no such config
  # exists, e.g. a Drupal site root pointing at the custom-code directories.
  # A configured path holding nothing analysable reports a labeled pass.
  phpcs:          { on: true,  standard: "Drupal,DrupalPractice" }

  # level: 0-9 or "max". ("off" is superseded like on: false — the analyser
  # is mandatory; lower the level instead of disarming it.)
  phpstan:        { on: true,  level: 6 }

  phpunit:        { on: true }

  mutation:       { on: false, msi_min: 0 }
  playwright:     { on: false }
  coverage:       { on: false, min: 0 }

  # Artifacts are truth. Recommended on even in a light run: a run that stops
  # checking whether the page renders is not light, it is blind.
  #
  # No droost MCP tool renders a page, so this gate is implemented by the
  # live-site surface rather than by droost — which means a run with no
  # booted site records it "skipped, no site" rather than passed. That is the
  # intended behaviour and the reason it ships on: the gate you most want is
  # the one whose absence must be visible in the report.
  #
  # It takes one option: which internal paths to render, comma-separated.
  #   rendered_check: { on: true, routes: "/,/pricing" }
  # Omitted, the live surface renders "/".
  rendered_check: { on: true }

  # Your own commands as first-class gates — semgrep, behat, anything.
  # Everything is explicit (a custom gate has no preset base, so nothing
  # about it is inferred): `on`, `phase` (code | test — everything enabled
  # re-runs at complete anyway) and a single-line `cmd`. Exit zero passes; a
  # command the shell cannot find reports tool-missing, which blocks, never
  # passes. Uncomment to use:
  # custom:
  #   semgrep: { on: true, phase: code, cmd: "semgrep scan --error --quiet" }

# The seeker checkpoint: an adversarial reviewer (the workflow-seeker agent)
# inspects the run's diff after the code phase's gates pass, and again at
# complete. Gates verify rules; the seeker verifies judgment — dead new
# code, drift from the spec, coupling the change breaks, weak tests,
# security smells, discipline defeats. On by default and highly
# recommended; the switch is the only lever (the one-hop blast radius and
# the six lenses are the pattern, not configuration). Turning it off is
# recorded in every lever report, like enforcement: off.
seekers: { on: true }

# How many times a failing gate may drive the feedback loop before the run
# fails. 0 means a gate gets one attempt and no retry. The seeker hold is
# not a failing gate and spends none of this.
max_gate_retries: 2
