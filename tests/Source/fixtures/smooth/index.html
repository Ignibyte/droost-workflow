<!doctype html>
<html><head><meta charset="utf-8"><title>Smooth</title>
<style>html{scroll-behavior:smooth} body{margin:0;font:16px Arial} section{height:1400px} footer{height:100px}</style></head>
<body><header><a href="/">Smooth</a></header>
<main><section><h1>A tall page</h1></section><section><p>Middle</p></section><section><p>Lower</p></section><section><p>Lower still</p></section><section><p>Near the end</p></section><section><p>Nearer</p></section><section><p>Last but one</p></section><section id="last"><h2></h2></section></main>
<footer><a href="/">Home</a></footer>
<script>
  // Filled only once in view, as an in-view animation shows its text.
  new IntersectionObserver((seen, o) => { if (seen.some((s) => s.isIntersecting)) { document.querySelector('#last h2').textContent = 'Read at the bottom'; o.disconnect(); } }).observe(document.getElementById('last'));
</script>
</body></html>
